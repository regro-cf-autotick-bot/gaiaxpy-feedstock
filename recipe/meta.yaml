{% set name = "gaiaxpy" %}
{% set version = "2.1.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gaiaxpy-{{ version }}.tar.gz
  sha256: 5f200e3973617c5316492ecb388c63091e89a5bda8835e2ab0a1aacf6735868b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.8
    - aenum
    - astropy
    - astroquery
    - fastavro
    - python-hdfs
    - matplotlib-base
    - numpy >1.23
    - packaging
    - pandas >=1.5.0
    - scipy
    - tqdm >=4.64.0

test:
  imports:
    - gaiaxpy
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://gaia-dpci.github.io/GaiaXPy-website/
  summary: GaiaXPy is a Python library to facilitate handling Gaia BP/RP spectra as distributed from the Gaia archive.
  license: 'BSD-3-Clause'
  license_file: LICENCE

extra:
  recipe-maintainers:
    - mwittgen
    - roceb
